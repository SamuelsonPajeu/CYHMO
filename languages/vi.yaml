# Pacote de idioma — Vietnamita
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# O vietnamita distingue palavras só pelo tom, e a normalização não remove diacrítico.
# As formas sem acento entram como reserva para quando o Whisper as omite, MENOS quando
# duas palavras colidiriam ao perder o tom: "đuôi" (cauda) e "dưới" (baixo) viram ambas
# "duoi", então só as formas acentuadas estão cadastradas para esse par.

