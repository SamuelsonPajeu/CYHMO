# Pacote de idioma — Coreano
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# O coreano separa por espaço, então word_separator fica no padrão "space".
# O numeral sino-coreano 이 (2) ficou DE FORA: sozinho ele é pronome e partícula, e casaria
# dentro de frase comum. Para "2" use 둘 ou o dígito, que o Whisper costuma emitir.

