# Pacote de idioma — Alemão
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# A normalização não remove trema nem ß, então as formas com "ä ö ü ß" estão
# cadastradas junto das transcritas "ae oe ue ss": o Whisper alterna entre as duas.

code: de
name: Deutsch
stt_language: de

