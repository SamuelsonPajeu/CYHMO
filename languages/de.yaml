    erster: 1
    erste: 1
    zweiter: 2
    zweite: 2
    dritter: 3
    dritte: 3
    vierter: 4
    vierte: 4
    fünfter: 5
    fuenfter: 5
    sechster: 6
    sechste: 6

quantifiers: [mal]
connectives: [und, dann, danach, und dann, anschließend, anschliessend]
affirmations: [ja, jawohl, klar, ok, okay, genau, richtig, stimmt]
negations: [nein, nö, noe, negativ, niemals, auf keinen fall]
target_words: [nummer, gegner, feind, ziel]

