  Dodge: [weich aus, ausweichen, geh aus dem weg]
  Hide: [versteck dich, geh in deckung]
  Get up: [steh auf, aufstehen, komm hoch]
  Jump: [spring, spring jetzt]
  Look out: [pass auf, vorsicht, achtung]
  Throw it: [wirf es, wirf das]
  Front: [nach vorne, vorwärts, vorwaerts]
  Back: [nach hinten, zurück, zurueck]
  Left: [links, nach links]
  Right: [rechts, nach rechts]
  Up: [nach oben, hoch]
  Down: [nach unten, runter]
  Head: [kopf, auf den kopf, schieß auf den kopf, schiess auf den kopf]
  Mouth: [mund, in den mund]
  Eye: [auge, ins auge]
  Left eye: [linkes auge, ins linke auge]
  Middle eye: [mittleres auge, das mittlere auge]
  Right eye: [rechtes auge, ins rechte auge]
  Red eye: [rotes auge, ins rote auge]
  Tongue: [zunge, auf die zunge]
  Stomach: [bauch, magen, in den bauch]
  Body: [körper, koerper, auf den körper, auf den koerper]
  Tail: [schwanz, auf den schwanz]
  Consultation: [beratung, lass uns reden, sprechen wir]
  Camera check: [prüf die kamera, pruef die kamera, schau auf die kamera]
  Break time: [pause, mach eine pause, zeit für eine pause, zeit fuer eine pause]
  Zoom in: [zoom rein, näher ran, naeher ran]
  "Yes": [ja, jawohl, genau]
  "No": [nein, auf keinen fall]
