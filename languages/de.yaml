command_examples:
  Walk: [geh, gehe weiter, lauf weiter]
  Run: [renn, lauf, schneller, lauf los]
  Stop: [halt, stopp, bleib stehen, warte da]
  Go back: [geh zurück, geh zurueck, zurück, zurueck, kehr um]
  Check: [prüf das, pruef das, untersuche das, schau es dir an]
  Read: [lies, lies das]
  Open: [öffne, oeffne, mach auf, mach es auf]
  Close: [schließ, schliess, mach zu]
  Look: [schau, schau dir das an]
  Use: [benutze, benutz das]
  Take: [nimm, nimm es, heb es auf]
