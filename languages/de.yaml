    "null": 0
    eins: 1
    ein: 1
    eine: 1
    zwei: 2
    drei: 3
    vier: 4
    fünf: 5
    fuenf: 5
    sechs: 6
    sieben: 7
    acht: 8
    neun: 9
    zehn: 10
