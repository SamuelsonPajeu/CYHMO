# Pacote de idioma — Árabe
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# O imperativo em árabe flexiona por gênero e quem recebe a ordem no jogo é a Rio, uma
# mulher. As duas formas estão cadastradas — اطلق (masc.) e اطلقي (fem.) — porque o jogador
# fala como quiser e o Whisper transcreve o que ouviu.
#
# Hamza e alif estão cadastrados nas duas grafias (أطلق e اطلق): a normalização NFKC não
# unifica أ إ آ com ا, e o Whisper alterna entre elas.
# O árabe é escrito da direita para a esquerda; a ordem visual das chaves neste arquivo
# não altera nada, a comparação é sobre a string.

