# Pacote de idioma — Turco
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# As formas com "ç ğ ı ö ş ü" estão cadastradas junto das transcritas sem diacrítico:
# a normalização não remove acento e o Whisper alterna entre as duas.
# Ressalva do "İ" maiúsculo: str.lower() do Python devolve "i" + ponto combinante, que não
# casa com o "i" simples. Palavra iniciada por İ pode escapar; prefira exemplos sem ela.
#
# Atenção de YAML: "on" (dez) é booleano em YAML 1.1 e precisa de aspas.

