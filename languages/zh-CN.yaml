# Pacote de idioma — Chinês simplificado (mandarim)
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# word_separator: none — o chinês escreve sem espaço entre palavras. A fronteira de palavra
# sai deste vocabulário por casamento mais longo, então um termo que falte aqui é cortado
# caractere a caractere. Prefira cadastrar a palavra inteira (停下) a confiar no caractere.
#
# Variantes tradicionais das palavras de comando estão cadastradas junto das simplificadas:
# o Whisper alterna entre as duas escritas conforme a âncora da cena, e uma transcrição em
# tradicional não pode deixar o comando mudo.

