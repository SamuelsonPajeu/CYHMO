# Pacote de idioma — Hindi
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# Chandrabindu (ँ) e anusvara (ं) estão cadastrados juntos — आँख e आंख, मुँह e मुंह — porque
# o Whisper alterna entre os dois sinais e a normalização NFKC não os unifica.
# O imperativo em hindi (forma तुम: करो) não flexiona por gênero, então uma forma basta.

