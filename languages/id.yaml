# Pacote de idioma — Indonésio
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# O indonésio falado usa muita forma coloquial ("nggak", "udah"), então as variantes
# informais estão cadastradas junto das formais: o Whisper transcreve o que foi dito.

code: id
name: Bahasa Indonesia
stt_language: id

numerals:
  cardinal:
    nol: 0
    kosong: 0
    satu: 1
    dua: 2
    tiga: 3
    empat: 4
    lima: 5
    enam: 6
    tujuh: 7
    delapan: 8
    sembilan: 9
    sepuluh: 10
  ordinal:
    pertama: 1
    kesatu: 1
    kedua: 2
    ketiga: 3
    keempat: 4
    kelima: 5
    keenam: 6

quantifiers: [kali]
