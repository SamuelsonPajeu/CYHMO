# Pacote de idioma — Japonês
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# word_separator: none — o japonês escreve sem espaço entre palavras. A fronteira de palavra
# sai deste vocabulário por casamento mais longo, então um termo que falte aqui é cortado
# caractere a caractere. Prefira cadastrar a palavra inteira (止まって) a confiar no caractere.
#
# Kana de um caractere só ficou DE FORA de propósito: は, ね, め, に, し, ご e く são
# partículas ou sufixos comuns e casariam dentro de qualquer frase. As formas em kanji
# (目, 頭, 下) são seguras porque não aparecem como partícula.

