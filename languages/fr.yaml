  Consultation: [consultation, on discute, parlons]
  Camera check: [vérifie la caméra, verifie la camera, regarde la caméra, regarde la camera]
  Break time: [pause, on fait une pause, temps de repos]
  Zoom in: [zoome, fais un zoom, rapproche l'image]
  "Yes": [oui, ouais, d'accord, daccord]
  "No": [non, nan, pas du tout]
