  Left: [gauche, à gauche, a gauche]
  Right: [droite, à droite, a droite]
  Up: [en haut, vers le haut]
  Down: [en bas, vers le bas]
  Head: [la tête, la tete, tire dans la tête, tire dans la tete]
  Mouth: [la bouche, dans la bouche]
  Eye: [l'œil, l'oeil, dans l'œil, dans l'oeil]
  Left eye: [œil gauche, oeil gauche, dans l'œil gauche, dans l'oeil gauche]
  Middle eye: [œil du milieu, oeil du milieu, œil central, oeil central]
  Right eye: [œil droit, oeil droit, dans l'œil droit, dans l'oeil droit]
  Red eye: [œil rouge, oeil rouge, dans l'œil rouge, dans l'oeil rouge]
  Tongue: [la langue, dans la langue]
  Stomach: [le ventre, l'estomac, dans le ventre]
  Body: [le corps, sur le corps]
