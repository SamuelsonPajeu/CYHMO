# Pacote de idioma — Francês
# Esquema: src/cyhmo/domain/language_pack.py. Chaves em minúsculas, sem pontuação.
# As chaves de command_examples são as strings LITERAIS da gramática do jogo
# (comparação insensível a maiúsculas). Exemplos são frases faladas, de autoria própria.
#
# A normalização não remove acento, então as formas acentuada e sem acento estão
# cadastradas juntas: o Whisper alterna entre as duas conforme o áudio.
# "œ" não é decomposto pelo NFKC, então "œil" e "oeil" são chaves distintas.

code: fr
name: Français
stt_language: fr

numerals:
  cardinal:
    zéro: 0
    zero: 0
    un: 1
    une: 1
    deux: 2
    trois: 3
    quatre: 4
    cinq: 5
    six: 6
    sept: 7
    huit: 8
    neuf: 9
    dix: 10
  ordinal:
    premier: 1
    première: 1
    premiere: 1
    deuxième: 2
    deuxieme: 2
    second: 2
    seconde: 2
    troisième: 3
    troisieme: 3
    quatrième: 4
    quatrieme: 4
    cinquième: 5
    cinquieme: 5
    sixième: 6
    sixieme: 6

quantifiers: [fois]
connectives: [et, puis, ensuite, et puis, après, apres, alors]
affirmations: [oui, ouais, ok, d'accord, daccord, affirmatif, bien sûr, bien sur, exact]
negations: [non, nan, négatif, negatif, jamais, pas du tout]
target_words: [numéro, numero, ennemi, cible]

