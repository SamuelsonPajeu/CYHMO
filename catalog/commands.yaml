# =============================================================================
# CYHMO — commands.yaml (anexo semântico, opcional)
#
# Este arquivo NÃO é a fonte do vocabulário: o vocabulário é lido da gramática
# ativa na memória do jogo, em tempo real, a cada troca de cena. O que ele
# acrescenta é contexto — categoria, situação de uso e exemplos falados por
# idioma — para enriquecer o casamento de intenção, sobretudo nos comandos de
# alta frequência, que de outro modo chegam sem nenhum exemplo em pt-BR.
# O mod roda sem ele; ausente, o matching segue só com as strings do jogo.
#
# As categorias, os contextos e as listas de palavras-chave foram levantados a
# partir do guia de Daniel Engel no GameFAQs:
#   https://gamefaqs.gamespot.com/ps2/561643-lifeline/faqs
# Nenhum trecho do guia é reproduzido aqui: locais e ações de desbloqueio estão
# PARAFRASEADOS e as respostas da Rio não aparecem. Os códigos entre parênteses
# nas notas (G-01..G-05, F-01..F-06 e as seções por letra) apontam para seções
# desse guia.
#
# Convenções dos campos:
# - game_id: null em todas as entradas — o jogo casa pela string, não por id.
# - class core => examples."pt-BR" com 2 a 4 variações faladas.
# - category scenario => somente examples.en.
# - class free_phrase => sem pt-BR, fora do MVP.
# - source: presente nas entradas que não vêm das listas de palavras-chave.
# - class e contexts derivados do guia são hipóteses, não verificação em jogo.
# - notes: campo informativo; o mod lê apenas key, category e examples.
# =============================================================================
version: 1
commands:

