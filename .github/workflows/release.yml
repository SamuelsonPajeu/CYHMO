name: Release

# A release so sai quando alguem dispara este workflow a mao. Antes, todo push na main
# criava tag e release, entao um ajuste de README virava versao nova. Agora quem publica
# escolhe o incremento na hora de rodar o workflow.
# A verificacao de cada commit continua: ci.yml roda sozinho em pull request e em push
# na main.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento da versao a publicar"
        type: choice
        options: [patch, minor, major, auto]
        default: patch
      dry_run:
        description: "Ensaio: monta e confere o pacote, sem criar tag nem publicar"
        type: boolean
        default: false

permissions:
  contents: write

# cancel-in-progress fica FALSE de proposito: cancelar no meio pode deixar uma tag
# criada sem release publicada. Execucoes seguidas enfileiram em vez de se atropelar.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  smoke:
    uses: ./.github/workflows/ci.yml

  version:
    name: Proxima versao
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      bump: ${{ steps.calc.outputs.bump }}
      previous: ${{ steps.calc.outputs.previous }}

    steps:
      - name: Checkout com historico e tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Calcula a versao
        id: calc
        shell: bash
        run: |
          set -euo pipefail

          forced="${{ inputs.bump }}"

          # O glob do git nao distingue digito de sufixo: sem o grep, uma tag como
          # v1.0.0-rc1 vira base "1.0.0-rc1" e a aritmetica derruba o job.
          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$previous" ]; then
            echo "::warning::nenhuma tag vX.Y.Z encontrada; partindo de 0.0.0."
            base="0.0.0"
            range=""
          else
            base="${previous#v}"
            range="${previous}..HEAD"
          fi

          if [ "$forced" != "auto" ]; then
            bump="$forced"
          else
            # Le o intervalo inteiro em vez de so o commit de topo: com fast-forward
            # merge o 'feat:' fica alguns commits atras e olhar so o topo perde o bump.
            log="$(git log --no-merges --format='%s%n%b' ${range:+$range})"
            if printf '%s\n' "$log" | grep -qiE '^[a-z]+(\([^)]*\))?!:' \
              || printf '%s\n' "$log" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              bump="major"
            elif printf '%s\n' "$log" | grep -qiE '^feat(\([^)]*\))?:'; then
              bump="minor"
            else
              bump="patch"
            fi
          fi

          IFS=. read -r major minor patch <<< "$base"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "::error::a tag v${version} ja existe; apague-a antes de repetir a release"
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "bump=${bump}"
            echo "previous=${previous}"
          } >> "$GITHUB_OUTPUT"

          echo "### v${version} (${bump}, anterior: ${previous:-nenhuma})" >> "$GITHUB_STEP_SUMMARY"

  portatil:
    name: Zip portatil e publicacao
    needs: [smoke, version]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # shell: pwsh (PowerShell 7, o padrao do windows-latest) com utf8NoBOM.
      # O Set-Content do PowerShell 5.1 grava BOM e corrompe acentos. Nao trocar
      # por shell: powershell.
      - name: Carimba a versao da tag no pacote
        shell: pwsh
        run: |
          $text = Get-Content 'pyproject.toml' -Raw -Encoding UTF8
          $pattern = '(?m)^version\s*=\s*"[^"]*"'
          if ($text -notmatch $pattern) { throw "nao achei a linha de versao em pyproject.toml" }
          ($text -replace $pattern, "version = `"$env:VERSION`"") |
            Set-Content 'pyproject.toml' -Encoding utf8NoBOM -NoNewline
          Write-Host "carimbado: pyproject.toml -> $env:VERSION"

      - name: Monta o zip portatil
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name  = "CYHMO_portable"
          $stage = Join-Path 'dist' $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # O runtime resolve languages/, config/ e catalog/ relativos ao diretorio do
          # config.toml, entao o zip precisa preservar esse layout de pastas.
          $payload = @(
            'src', 'languages', 'config', 'catalog', 'datasets',
            'pyproject.toml', 'requirements.txt',
            'README.md', 'LICENSE', 'install.ps1', 'CYHMO.cmd'
          )
          foreach ($item in $payload) {
            if (-not (Test-Path $item)) { throw "faltando no repositorio: $item" }
            Copy-Item $item -Destination $stage -Recurse -Force
          }

          Get-ChildItem $stage -Recurse -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force
          Set-Content (Join-Path $stage 'VERSION') $env:VERSION -Encoding utf8NoBOM

          $zip = "dist/$name.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = '{0:N1}' -f ((Get-Item $zip).Length / 1MB)

          # O cliente do auto-update recusa o pacote sem este arquivo: e daqui que ele le
          # o sha256 antes de trocar qualquer coisa na instalacao. Formato do sha256sum,
          # para conferir a mao tambem.
          $digest = "$zip.sha256"
          Set-Content $digest "$hash  $name.zip" -Encoding utf8NoBOM

          "zip=$zip"       | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "digest=$digest" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash"   | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size"     | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "$zip -- $size MB -- sha256 $hash"

      - name: Confere o pacote montado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = '${{ steps.build.outputs.zip }}'
          $declared = (Get-Content '${{ steps.build.outputs.digest }}' -Raw).Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($declared -ne $actual) { throw "o .sha256 publicado nao confere com o zip montado" }

          # O cliente exige estas entradas na raiz para aceitar a troca (REQUIRED_ENTRIES
          # em update/installer.py): se faltar uma, o erro so aparece na maquina do usuario.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $roots = $archive.Entries | ForEach-Object { ($_.FullName -split '[/\\]')[0] } | Sort-Object -Unique
          } finally {
            $archive.Dispose()
          }
          foreach ($required in @('src', 'pyproject.toml', 'CYHMO.cmd', 'VERSION')) {
            if ($roots -notcontains $required) { throw "o pacote nao traz $required na raiz" }
          }
          Write-Host "pacote conferido: sha256 $actual"

      - name: Escreve as notas da release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # O changelog da versao vai PRIMEIRO no corpo. A janela "Nova versao disponivel"
          # corta as notas em 1200 caracteres (NOTES_LIMIT em update/release.py), e quem ja
          # tem o mod instalado precisa ler o que mudou, nao como instalar.
          $lines = Get-Content 'CHANGELOG.md' -Encoding UTF8
          $header = '^##\s+' + [regex]::Escape($env:VERSION) + '\s*$'
          $found = $lines | Select-String -Pattern $header | Select-Object -First 1
          $changelog = @()
          if ($found) {
            for ($i = $found.LineNumber; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s') { break }
              $changelog += $lines[$i]
            }
          }
          if (-not ($changelog -join '').Trim()) {
            throw "CHANGELOG.md nao tem secao '## $env:VERSION'; a janela de atualizacao ficaria sem o que mudou"
          }

          $notes = (@(
            '',
            '## O que mudou'
          ) + $changelog + @(
            '',
            '## Como instalar',
            '',
            'Requer Windows, Python 3.11+ e o PCSX2 com o Lifeline (NTSC-U, SLUS-20848) rodando e o PINE habilitado.',
            '',
            # Aspas simples: dentro de aspas duplas a crase e o escape do PowerShell
            # e a marcacao de codigo do Markdown some das notas.
            'Baixe `CYHMO_portable.zip`, extraia numa pasta sua e clique em `CYHMO.cmd`.',
            '',
            '> O modelo de comparacao de comandos (~1 GB) e baixado na primeira execucao.',
            '> Diagnostico do ambiente: `CYHMO.cmd doctor`.',
            '',
            '## Verificacao',
            '',
            'O `CYHMO_portable.zip.sha256` publicado aqui e o mesmo arquivo que o mod confere',
            'antes de aplicar uma atualizacao automatica. Para conferir a mao no PowerShell:',
            '',
            '```',
            'Get-FileHash CYHMO_portable.zip -Algorithm SHA256',
            '```',
            '',
            '```',
            "sha256  $('${{ steps.build.outputs.sha256 }}')  ($('${{ steps.build.outputs.size }}') MB)",
            '```',
            ''
          )) -join "`n"
          Set-Content 'RELEASE_NOTES.md' $notes -Encoding utf8NoBOM

      - name: Ensaio concluido (nada publicado)
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          {
            echo "### Ensaio de release ${TAG}"
            echo ""
            echo "Pacote montado e conferido. Nenhuma tag foi criada e nada foi publicado."
            echo ""
            echo '```'
            echo "sha256  ${{ steps.build.outputs.sha256 }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A action cria a tag apontando para este commit quando ela ainda nao existe,
      # entao um build que falhar antes daqui nao deixa tag orfa.
      - name: Publica a release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: CYHMO ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.digest }}
          body_path: RELEASE_NOTES.md
          append_body: true
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
